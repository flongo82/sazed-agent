# Configuration of sazed-agent. scripts/setup.sh copies it to config.toml (ignored by git),
# filling in your bot's name and language from sazed-bot. Paths are relative to this folder.

# The name your bot introduces itself with, and the language of its messages: "auto" (the
# language of the user's Telegram app), "it" or "en". Keep them equal to sazed-bot's.
bot_name = "sazed"
language = "auto"

[secrets]
agent_token = "secrets/agent_token"
worker_url = "secrets/worker_url"
bot_token = "secrets/bot_token"
# MTProto, to download files beyond the Bot API's 20 MB: filled in by scripts/setup-mtproto.sh
api_id = "secrets/api_id"
api_hash = "secrets/api_hash"
mtproto_dir = "secrets/mtproto"   # the bot's MTProto session, written by the agent
# Claude API key, from the Claude Console: filled in by scripts/setup-claude.sh
anthropic_api_key = "secrets/anthropic_api_key"

[storage]
data_dir = "data"

[telegram]
api_base = "https://api.telegram.org"

# Claude, through its API. The key is not tied to a model: the agent names the model on every
# request. Haiku understands your messages, describes what it reads and answers your questions.
[claude]
api_base = "https://api.anthropic.com"
model = "claude-haiku-5-5"

# Reactions set on your messages, instead of replies; only some emoji are accepted, see
# https://core.telegram.org/bots/api#reactiontypeemoji
[reactions]
received = "👍"     # as soon as a message arrives: taken in charge
failed = "😢"       # put aside after all the attempts
unreadable = "🤷"   # the source of a link could not be read

[connection]
ping_interval = 30   # seconds between two pings to the Worker
pong_timeout = 10    # seconds to wait for the pong before reconnecting

[retries]
delays = [5, 30, 120, 600, 3600]   # seconds before each new attempt; then the item fails
